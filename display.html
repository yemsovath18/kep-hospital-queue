<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>មន្ទីរពេទ្យខេត្តកែប - អេក្រង់ហៅលេខ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Khmer OS', 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      background: #dbe9f7;
    }
    .screen {
      position: relative;
      height: 100vh;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #eaf4ff 0%, #d6ecfb 55%, #eaf4ff 100%);
      box-shadow: 0 0 50px rgba(18,58,122,0.2);
    }

    /* ---------- Top wave banner ---------- */
    .top-banner {
      position: relative;
      background: linear-gradient(120deg, #0a3474 0%, #1554b3 45%, #4a90d9 100%);
      padding: 22px 34px 46px;
      color: #fff;
    }
    .top-banner-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top-wave-svg {
      position: absolute;
      bottom: -1px; left: 0;
      width: 100%; height: 46px;
      display: block;
    }
    .logo-area { display: flex; align-items: center; gap: 16px; }
    .logo-circle {
      width: 64px; height: 64px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
    }
    .logo-circle img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .hospital-name .khmer { font-size: 27px; font-weight: 700; }
    .hospital-name .english { font-size: 17px; font-weight: 500; opacity: 0.92; letter-spacing: 1px; }
    .datetime { text-align: right; }
    .datetime .date { font-size: 18px; opacity: 0.92; }
    .datetime .time { font-size: 29px; font-weight: 700; }

    /* ---------- Main grid ---------- */
    .main-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 58% 42%;
      gap: 18px;
      padding: 10px 26px;
      min-height: 0;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 6px 18px rgba(13,61,143,0.15);
    }

    /* Now calling card */
    .card-header-solid {
      background: linear-gradient(120deg, #0a3474, #1554b3);
      color: #fff;
      text-align: center;
      padding: 12px;
      font-size: 27px;
      font-weight: 700;
    }
    .card-header-solid .sub { display: block; font-size: 18px; font-weight: 500; opacity: 0.92; }
    .now-calling-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
    }
    .speaker-icon { font-size: 60px; }
    .ticket-number {
      font-size: 180px;
      font-weight: 800;
      color: #123a7a;
      line-height: 1;
    }
    .divider { width: 70%; border-top: 2px solid #d7e2f5; margin: 6px 0; }
    .proceed-text { font-size: 25px; color: #333; }
    .counter-text { font-size: 40px; font-weight: 800; color: #123a7a; }
    .placeholder { opacity: 0.45; }

    @keyframes flash {
      0%   { transform: scale(1);    filter: brightness(1); }
      15%  { transform: scale(1.06); filter: brightness(1.3); }
      30%  { transform: scale(1);    filter: brightness(1); }
    }
    .flash { animation: flash 0.9s ease-in-out 2; }

    /* Next in queue card */
    .card-header-light {
      text-align: center;
      padding: 14px 12px 10px;
      color: #123a7a;
      font-size: 25px;
      font-weight: 700;
    }
    .card-header-light .sub { display: block; font-size: 16px; font-weight: 500; color: #4a6fa5; }
    .queue-table-wrap { flex: 1; overflow: hidden; padding: 0 14px 14px; }
    table.queue-table { width: 100%; border-collapse: collapse; }
    table.queue-table th {
      background: linear-gradient(120deg, #0a3474, #1554b3);
      color: #fff;
      font-size: 18px;
      padding: 10px 6px;
      text-align: center;
    }
    table.queue-table th:first-child { border-top-left-radius: 8px; }
    table.queue-table th:last-child { border-top-right-radius: 8px; }
    table.queue-table td {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      color: #1a1a1a;
      padding: 10px 6px;
      border-bottom: 1px solid #eef3fb;
    }
    table.queue-table tr:nth-child(even) td { background: #eaf2fc; }
    table.queue-table td.ticket-col { color: #1554b3; }
    .empty-row td { color: #aaa; font-weight: 500; font-size: 18px; }

    /* ---------- Bottom decorative scene + tagline ---------- */
    .bottom-scene {
      position: relative;
      height: 15vh;
      min-height: 90px;
      overflow: hidden;
    }
    .bottom-scene svg { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; }
    .tagline {
      position: absolute;
      left: 0; right: 0;
      bottom: 14px;
      text-align: center;
      color: #123a7a;
      z-index: 2;
    }
    .tagline-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
    .tagline-row .line { width: 60px; height: 2px; background: #123a7a; opacity: 0.5; }
    .tagline-khmer { font-size: 25px; font-weight: 700; }
    .tagline-english { font-size: 16px; margin-top: 2px; }

    /* ---------- Sound overlay ---------- */
    #soundOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 22px;
      cursor: pointer;
      z-index: 999;
      text-align: center;
    }
    #soundOverlay .icon { font-size: 48px; }
    #audioStatus {
      position: fixed;
      bottom: 6px; left: 10px;
      font-size: 11px;
      color: rgba(18,58,122,0.5);
      z-index: 5;
    }
  </style>
</head>

  </div>

  <script src="api.js"></script>
  <script>
    var lastTicket = null;
    var availableAudioKeys = [];  // array of clip keys, e.g. ["Customer","A",...,"001",...]
    var audioCache = {};          // { key: dataURI } - filled in as clips are fetched
    var soundEnabled = false;
    var announcePlayer = new Audio();
    var repeatTimer = null;
    var currentAnnounceKeys = null;

    // A real (but silent) short clip, embedded directly - used only to satisfy the
    // browser's autoplay policy, which requires an actual successful play() call
    // to happen synchronously inside a user click before later script-triggered
    // audio is allowed to play.
    var SILENT_UNLOCK_URI = 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YSADAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==';

    // --- Load the audio manifest as soon as the page loads (doesn't need a click) ---
    loadAudioManifest();

    function loadAudioManifest() {
      HospitalAPI.getAudioManifest()
        .then(function (manifest) {
          if (manifest && Array.isArray(manifest)) {
            availableAudioKeys = manifest;
            setAudioStatus('សំឡេង៖ រកឃើញ ' + manifest.length + ' file');
          } else if (manifest && manifest.error) {
            setAudioStatus('សំឡេង៖ error - ' + manifest.error);
          } else {
            setAudioStatus('សំឡេង៖ error - unexpected manifest format');
          }
        })
        .catch(function (err) {
          setAudioStatus('សំឡេង៖ បរាជ័យ - ' + err.message);
        });
    }

    function setAudioStatus(text) {
      var el = document.getElementById('audioStatus');
      if (el) el.innerText = text;
    }

    // --- Enable sound on first user interaction (required by browser autoplay rules) ---
    document.getElementById('soundOverlay').addEventListener('click', function () {
      soundEnabled = true;
      this.style.display = 'none';
      // Play a real (silent) clip synchronously from this click - this is what
      // actually unlocks later programmatic audio.play() calls in most browsers.
      announcePlayer.src = SILENT_UNLOCK_URI;
      announcePlayer.play().catch(function (err) { setAudioStatus('សំឡេង៖ unlock error - ' + err.message); });
      refreshDisplay();
    });

    // Fetches one clip's actual audio bytes (as a data URI) the first time it's needed,
    // then reuses the cached copy on every later call - so repeats don't re-fetch.
    function getClipDataURI(key, callback) {
      if (audioCache[key]) { callback(audioCache[key]); return; }
      if (availableAudioKeys.indexOf(key) === -1) { callback(null); return; } // no clip recorded for this key

      HospitalAPI.getAudioData(key)
        .then(function (result) {
          if (result && result.base64) {
            var uri = 'data:' + result.mimeType + ';base64,' + result.base64;
            audioCache[key] = uri;
            callback(uri);
          } else {
            setAudioStatus('សំឡេង៖ clip error (' + key + ') - ' + (result && result.error));
            callback(null);
          }
        })
        .catch(function (err) {
          setAudioStatus('សំឡេង៖ clip fetch failed (' + key + ') - ' + err.message);
          callback(null);
        });
    }

    // Plays a list of audio keys in sequence (e.g. ['Customer','G','023','Counter3']).
    // Missing/failed clips are skipped silently. Calls onDone() after the last one finishes.
    function playSequence(keys, onDone) {
      var idx = 0;
      function playNext() {
        if (idx >= keys.length) { if (onDone) onDone(); return; }
        var key = keys[idx];
        idx++;
        getClipDataURI(key, function (uri) {
          if (!uri) { playNext(); return; }
          announcePlayer.onended = playNext;
          announcePlayer.onerror = playNext;
          announcePlayer.src = uri;
          announcePlayer.play().catch(function (err) {
            setAudioStatus('សំឡេង៖ play error (' + key + ') - ' + err.message);
            playNext();
          });
        });
      }
      playNext();
    }

    // Builds the announcement key sequence for a ticket, e.g. "G023" + counter "3"
    // -> ['Customer', 'G', '023', 'Counter3']
    function buildAnnounceKeys(ticketNumber, counter) {
      var letter = ticketNumber.charAt(0);
      var number = ticketNumber.slice(1); // e.g. "023"
      return ['Customer', letter, number, 'Counter' + counter];
    }

    // Announces once, then keeps repeating every few seconds until the ticket changes
    // (scheduleAnnounce is called again with new keys, which cancels this loop).
    function scheduleAnnounce(keys) {
      clearTimeout(repeatTimer);
      currentAnnounceKeys = keys;
      var runOnce = function () {
        playSequence(keys, function () {
          repeatTimer = setTimeout(function () {
            // Only repeat if this is still the current ticket being called
            if (currentAnnounceKeys === keys) runOnce();
          }, 15000);
        });
      };
      runOnce();
    }

    // --- Clock ---
    function updateClock() {
      var now = new Date();
      var dateStr = new Intl.DateTimeFormat('en-US', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(now);
      var timeStr = new Intl.DateTimeFormat('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }).format(now);
      document.getElementById('dateText').innerText = dateStr;
      document.getElementById('timeText').innerText = timeStr;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // --- Poll queue overview every 5 seconds ---
    function refreshDisplay() {
      HospitalAPI.getDisplayOverview()
        .then(renderOverview)
        .catch(function (err) {
          setAudioStatus('សំឡេង៖ refresh error - ' + err.message);
        });
    }

    function renderOverview(overview) {
      var ticketEl = document.getElementById('ticketNumber');
      var counterEl = document.getElementById('counterNumber');
      var current = overview.current;

      if (!current) {
        ticketEl.innerText = '--';
        counterEl.innerText = '-';
        ticketEl.classList.add('placeholder');
      } else {
        ticketEl.classList.remove('placeholder');
        var isNew = current.ticketNumber !== lastTicket;
        ticketEl.innerText = current.ticketNumber;
        counterEl.innerText = current.counter;

        if (isNew) {
          ticketEl.classList.remove('flash');
          void ticketEl.offsetWidth; // reflow so animation can replay
          ticketEl.classList.add('flash');
          lastTicket = current.ticketNumber;
          if (soundEnabled) {
            scheduleAnnounce(buildAnnounceKeys(current.ticketNumber, current.counter));
          }
        }
      }

      // Render "Next in Queue" table
      var tbody = document.getElementById('queueTableBody');
      tbody.innerHTML = '';
      if (!overview.nextQueue || overview.nextQueue.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="3">មិនទាន់មានអ្នករង់ចាំ</td></tr>';
      } else {
        overview.nextQueue.forEach(function (row) {
          var tr = document.createElement('tr');
          tr.innerHTML =
            '<td>' + row.no + '</td>' +
            '<td class="ticket-col">' + row.ticketNumber + '</td>' +
            '<td>' + row.counter + '</td>';
          tbody.appendChild(tr);
        });
      }
    }

    refreshDisplay();
    setInterval(refreshDisplay, 5000);
  </script>
</body>
</html>
