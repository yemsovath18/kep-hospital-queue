<!DOCTYPE html>
<html>
<head>
  <meta name="referrer" content="no-referrer">
  <script src="api.js"></script>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      font-family: 'Khmer OS Siemreap', 'Segoe UI', Arial, sans-serif;
      background: #dbe9f7;
    }
    .screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 22px 26px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      background: linear-gradient(180deg, #bfe3fb 0%, #e8f6ff 45%, #cfeaf9 100%);
      box-shadow: 0 0 40px rgba(18,58,122,0.15);
    }

    /* ---------- Header ---------- */
    .header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }
    .logo-area { display: flex; align-items: center; gap: 12px; width: 100%; min-width: 0; }
    .logo-circle {
      width: 56px; height: 56px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      flex-shrink: 0;
    }
    .logo-circle img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .hospital-name { min-width: 0; flex: 1; }
    .hospital-name .khmer,
    .hospital-name .english {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hospital-name .khmer { font-size: 17px; font-weight: 800; color: #123a7a; line-height: 1.3; }
    .hospital-name .english { font-size: 13px; font-weight: 700; color: #123a7a; }
    .datetime { text-align: right; align-self: flex-end; }
    .datetime .date { font-size: 10px; color: #123a7a; font-weight: 600; }
    .datetime .time { font-size: 15px; font-weight: 800; color: #123a7a; }

    /* ---------- Title ---------- */
    .title-section { text-align: center; margin: 10px 0 24px; }
    .title-khmer { font-size: 26px; font-weight: 800; color: #123a7a; }
    .title-english { font-size: 14px; font-weight: 600; color: #4a6fa5; margin-top: 4px; }

    /* ---------- Service buttons ---------- */
    .buttons-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 16px;
      width: 100%;
    }
    @media (max-width: 480px) {
      .buttons-list { grid-template-columns: 1fr; }
    }
    .service-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: none;
      border-radius: 16px;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.18);
      transition: transform 0.12s;
      text-align: left;
      min-width: 0;
    }
    .service-btn:active { transform: scale(0.97); }
    .service-btn .icon-circle {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.25);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .service-btn .label {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .service-btn .arrow { font-size: 16px; font-weight: 800; opacity: 0.9; flex-shrink: 0; }

    .color-0 { background: linear-gradient(120deg, #2563eb, #1554b3); }
    .color-1 { background: linear-gradient(120deg, #22a55e, #15803d); }
    .color-2 { background: linear-gradient(120deg, #ec4899, #db2777); }
    .color-3 { background: linear-gradient(120deg, #8b5cf6, #7c3aed); }
    .color-4 { background: linear-gradient(120deg, #ef4444, #dc2626); }
    .color-5 { background: linear-gradient(120deg, #f97316, #ea580c); }
    .color-6 { background: linear-gradient(120deg, #06b6d4, #0891b2); }
    .color-7 { background: linear-gradient(120deg, #eab308, #ca8a04); }
    .color-8 { background: linear-gradient(120deg, #6366f1, #4f46e5); }
    .color-9 { background: linear-gradient(120deg, #14b8a6, #0d9488); }

    .loading, .error { text-align: center; margin-top: 16px; font-size: 13px; }
    .loading { color: #4a6fa5; }
    .error { color: #d92d20; font-weight: 600; }

    /* ---------- Ticket result overlay ---------- */
    #ticketResult {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(18,58,122,0.55);
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    #ticketResult .ticket-card {
      background: #fff;
      border-radius: 22px;
      padding: 36px 30px;
      text-align: center;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    #ticketResult .label { color: #4a6fa5; font-size: 13px; font-weight: 600; }
    #ticketResult .number { font-size: 56px; font-weight: 800; color: #123a7a; margin: 8px 0; }
    #ticketResult .meta { color: #555; font-size: 13px; margin-bottom: 20px; }
    .action-buttons { display: flex; gap: 10px; }
    .action-buttons button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      font-weight: 700;
    }
    .print-btn { background: #1554b3; }
    .new-ticket-btn { background: #6b7280; }

    /* ---------- Footer ---------- */
    .footer {
      margin-top: auto;
      padding-top: 22px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #123a7a;
    }
    .footer .heart-icon { font-size: 18px; }
    .footer .tagline-khmer { font-size: 13px; font-weight: 700; }
    .footer .tagline-english { font-size: 10px; color: #4a6fa5; }

    /* ---------- Print receipt (hidden, print-only) ---------- */
    #printArea { display: none; }
    @page {
      size: 80mm auto;
      margin: 0;
    }
    @media print {
      .screen, #ticketResult { display: none !important; }
      #printArea {
        display: block !important;
        width: 80mm;
        padding: 5mm 3mm 6mm;
        text-align: center;
        color: #000;
        font-family: 'Khmer OS', Arial, sans-serif;
      }
      #printArea .print-logo { width: 20mm; height: 20mm; display: block; margin: 0 auto 2mm; }
      #printArea .print-hospital-khmer { font-size: 15pt; font-weight: bold; color: #1554b3; margin-bottom: 1mm; }
      #printArea .print-subtitle { font-size: 10pt; color: #000; margin-bottom: 2mm; }
      #printArea .print-line { border-top: 1px dashed #000; margin: 2.5mm 0; }
      #printArea .print-label { font-size: 10pt; margin-top: 1mm; }
      #printArea .print-number { font-size: 60pt; font-family: 'Arial Black', Arial, sans-serif; font-weight: 900; line-height: 1; margin: 2mm 0; }
      #printArea .print-meta { font-size: 9pt; margin-top: 1mm; }
      #printArea .print-footer { font-size: 9pt; margin-top: 1mm; }
    }
  </style>
</head>

    <div class="print-line"></div>
    <div class="print-label">លេខរង់ចាំរបស់អ្នក</div>
    <div class="print-number" id="printTicketNumber">-</div>
    <div class="print-meta" id="printTicketMeta"></div>
    <div class="print-line"></div>
    <div class="print-footer">សូមរង់ចាំការហៅលេខ សូមអរគុណ</div>
  </div>

  <script>
    function updateClock() {
      var now = new Date();
      var dateStr = new Intl.DateTimeFormat('en-US', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(now);
      var timeStr = new Intl.DateTimeFormat('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }).format(now);
      document.getElementById('dateText').innerText = dateStr;
      document.getElementById('timeText').innerText = timeStr;
    }
    updateClock();
    setInterval(updateClock, 1000);

    function loadServices() {
      apiCall('getServiceTypesFull', {}, renderButtons, function (err) { document.getElementById('statusMsg').innerHTML = '<div class="error">' + err.message + '</div>'; });
    }

    function renderButtons(services) {
      var container = document.getElementById('serviceButtons');
      container.innerHTML = '';
      services.forEach(function (s) {
        var btn = document.createElement('button');
        btn.className = 'service-btn ' + s.colorClass;
        btn.innerHTML =
          '<div class="icon-circle">' + s.icon + '</div>' +
          '<div class="label">' + s.name + '</div>' +
          '<div class="arrow">&#8250;</div>';
        btn.onclick = function () { takeTicket(s.name); };
        container.appendChild(btn);
      });
    }

    function takeTicket(serviceType) {
      document.getElementById('statusMsg').innerHTML = '<div class="loading">កំពុងទាញយកលេខ...</div>';
      apiCall('createTicket', { serviceType: serviceType }, function (res) {
        document.getElementById('statusMsg').innerHTML = '';
        if (res.success) {
          document.getElementById('ticketResult').style.display = 'flex';
          document.getElementById('ticketNumberDisplay').innerText = res.ticketNumber;
          document.getElementById('ticketMeta').innerText = res.serviceType + ' • ' + res.createdTime;
          document.getElementById('printTicketNumber').innerText = res.ticketNumber;
          document.getElementById('printTicketMeta').innerText = res.serviceType + ' • ' + res.createdTime;
        } else {
          document.getElementById('statusMsg').innerHTML = '<div class="error">' + res.error + '</div>';
        }
      }, function (err) {
        document.getElementById('statusMsg').innerHTML = '<div class="error">' + err.message + '</div>';
      });
    }

    function resetView() {
      document.getElementById('ticketResult').style.display = 'none';
    }

    function printTicket() {
      window.print();
    }

    loadServices();
  </script>
