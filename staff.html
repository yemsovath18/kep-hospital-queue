<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>មន្ទីរពេទ្យខេត្តកែប - ផ្ទាំងគ្រប់គ្រងបុគ្គលិក</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      font-family: 'Khmer OS Siemrap', 'Segoe UI', Arial, sans-serif;
      background: #eef4fb;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 22px 40px;
    }

    /* ---------- Header ---------- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-circle {
      width: 50px; height: 50px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      flex-shrink: 0;
    }
    .logo-circle img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .hospital-name .khmer { font-size: 18px; font-weight: 800; color: #123a7a; }
    .hospital-name .english { font-size: 12px; font-weight: 700; color: #4a6fa5; }
    .page-title { font-size: 14px; font-weight: 700; color: #123a7a; }
    .datetime { text-align: right; }
    .datetime .date { font-size: 11px; color: #4a6fa5; font-weight: 600; }
    .datetime .time { font-size: 17px; font-weight: 800; color: #123a7a; }

    /* ---------- Call section ---------- */
    .section-title { font-size: 15px; font-weight: 800; color: #123a7a; margin: 18px 0 10px; }
    .call-any-btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin-bottom: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(120deg, #0a3474, #1554b3);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(13,61,143,0.25);
    }
    .call-any-btn:active { transform: scale(0.99); }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .service-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: none;
      border-radius: 14px;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(0,0,0,0.15);
      text-align: left;
    }
    .service-btn:active { transform: scale(0.98); }
    .service-btn .icon-circle {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.25);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .service-btn .info { flex: 1; min-width: 0; }
    .service-btn .name {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .service-btn .counter-label { font-size: 11px; opacity: 0.9; }

    .color-0 { background: linear-gradient(120deg, #2563eb, #1554b3); }
    .color-1 { background: linear-gradient(120deg, #22a55e, #15803d); }
    .color-2 { background: linear-gradient(120deg, #ec4899, #db2777); }
    .color-3 { background: linear-gradient(120deg, #8b5cf6, #7c3aed); }
    .color-4 { background: linear-gradient(120deg, #ef4444, #dc2626); }
    .color-5 { background: linear-gradient(120deg, #f97316, #ea580c); }
    .color-6 { background: linear-gradient(120deg, #06b6d4, #0891b2); }
    .color-7 { background: linear-gradient(120deg, #eab308, #ca8a04); }
    .color-8 { background: linear-gradient(120deg, #6366f1, #4f46e5); }
    .color-9 { background: linear-gradient(120deg, #14b8a6, #0d9488); }

    /* ---------- Queue table ---------- */
    .table-wrap {
      margin-top: 22px;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(13,61,143,0.1);
    }
    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #eef3fb;
    }
    .table-header .section-title { margin: 0; }
    .refresh-note { font-size: 11px; color: #9aa8bd; }
    table.queue-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.queue-table th {
      background: #f3f7fd;
      color: #4a6fa5;
      font-size: 12px;
      font-weight: 700;
      padding: 10px 8px;
      text-align: left;
      white-space: nowrap;
    }
    table.queue-table td {
      padding: 10px 8px;
      border-bottom: 1px solid #f0f4fa;
      color: #1a1a1a;
      white-space: nowrap;
    }
    table.queue-table tr:last-child td { border-bottom: none; }
    .queue-table-scroll { overflow-x: auto; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }
    .badge-waiting { background: #f59e0b; }
    .badge-called { background: #2563eb; }
    .badge-done { background: #16a34a; }
    .badge-cancelled { background: #9ca3af; }

    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .row-actions button {
      border: none;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
    }
    .btn-call { background: #2563eb; }
    .btn-done { background: #16a34a; }
    .btn-cancel { background: #ef4444; }
    .empty-cell { text-align: center; color: #aaa; padding: 20px; }

    /* ---------- Toast ---------- */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(20px);
      background: #123a7a;
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 24px rgba(0,0,0,0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
      max-width: 90%;
      text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { background: #d92d20; }
  </style>
</head>

        <div class="hospital-name">
          <div class="khmer" style="font-family:'Khmer OS Muol Light'">មន្ទីរពេទ្យខេត្តកែប</div>
          <div class="english">KEP PROVINCIAL HOSPITAL</div>

      </div>
      <div class="page-title">ផ្ទាំងគ្រប់គ្រងបុគ្គលិក / Staff Control Panel</div>
      <div class="datetime">
        <div class="date" id="dateText">--</div>
        <div class="time" id="timeText">--</div>
      </div>
    </div>

    <div class="section-title">ហៅលេខបន្ទាប់</div>
    <button class="call-any-btn" onclick="callNext('')">📢 ហៅលេខបន្ទាប់ (គ្រប់សេវាទាំងអស់)</button>
    <div class="service-grid" id="serviceButtons"></div>

    <div class="table-wrap">
      <div class="table-header">
        <div class="section-title">បញ្ជីលេខរង់ចាំទាំងអស់</div>
        <div class="refresh-note">ធ្វើបច្ចុប្បន្នភាពរៀងរាល់ ៥ វិនាទី</div>
      </div>
      <div class="queue-table-scroll">
        <table class="queue-table">
          <thead>
            <tr>
              <th>លេខ</th>
              <th>សេវា</th>
              <th>បញ្ជរ</th>
              <th>ស្ថានភាព</th>
              <th>ពេលចេញលេខ</th>
              <th>ពេលហៅ</th>
              <th>សកម្មភាព</th>
            </tr>
          </thead>
          <tbody id="queueTableBody">
            <tr><td class="empty-cell" colspan="7">កំពុងផ្ទុកទិន្នន័យ...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="api.js"></script>
  <script>
    var STATUS_LABELS = {
      Waiting: 'កំពុងរង់ចាំ',
      Called: 'បានហៅ',
      Done: 'បានបញ្ចប់',
      Cancelled: 'បានលុបចោល'
    };
    var STATUS_BADGE_CLASS = {
      Waiting: 'badge-waiting',
      Called: 'badge-called',
      Done: 'badge-done',
      Cancelled: 'badge-cancelled'
    };

    function updateClock() {
      var now = new Date();
      var dateStr = new Intl.DateTimeFormat('en-US', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(now);
      var timeStr = new Intl.DateTimeFormat('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }).format(now);
      document.getElementById('dateText').innerText = dateStr;
      document.getElementById('timeText').innerText = timeStr;
    }
    updateClock();
    setInterval(updateClock, 1000);

    function showToast(message, isError) {
      var el = document.getElementById('toast');
      el.textContent = message;
      el.className = isError ? 'show error' : 'show';
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(function () {
        el.className = '';
      }, 3000);
    }

    function loadServiceButtons() {
      HospitalAPI.getServiceTypesFull()
        .then(renderServiceButtons)
        .catch(function (err) { showToast('កំហុស៖ ' + err.message, true); });
    }

    function renderServiceButtons(services) {
      var container = document.getElementById('serviceButtons');
      container.innerHTML = '';
      services.forEach(function (s) {
        var btn = document.createElement('button');
        btn.className = 'service-btn ' + s.colorClass;
        btn.innerHTML =
          '<div class="icon-circle">' + s.icon + '</div>' +
          '<div class="info">' +
            '<div class="name">' + s.name + '</div>' +
            '<div class="counter-label">បញ្ជរ ' + s.counter + '</div>' +
          '</div>';
        btn.onclick = function () { callNext(s.name); };
        container.appendChild(btn);
      });
    }

    function callNext(serviceType) {
      HospitalAPI.callNextTicket(serviceType)
        .then(function (res) {
          if (res.success) {
            showToast('បានហៅលេខ ' + res.ticketNumber + ' (' + res.serviceType + ')');
            refreshQueue();
          } else {
            showToast('កំហុស៖ ' + res.error, true);
          }
        })
        .catch(function (err) { showToast('កំហុស៖ ' + err.message, true); });
    }

    function updateStatus(queueId, newStatus, btn) {
      if (btn) btn.disabled = true;
      HospitalAPI.updateTicketStatus(queueId, newStatus)
        .then(function (res) {
          if (res.success) {
            showToast('បានធ្វើបច្ចុប្បន្នភាពស្ថានភាព');
            refreshQueue();
          } else {
            showToast('កំហុស៖ ' + res.error, true);
            if (btn) btn.disabled = false;
          }
        })
        .catch(function (err) {
          showToast('កំហុស៖ ' + err.message, true);
          if (btn) btn.disabled = false;
        });
    }

    function refreshQueue() {
      HospitalAPI.getQueueData()
        .then(renderQueueTable)
        .catch(function (err) { showToast('កំហុស៖ ' + err.message, true); });
    }

    function renderQueueTable(rows) {
      var tbody = document.getElementById('queueTableBody');
      tbody.innerHTML = '';

      if (!rows || rows.length === 0) {
        tbody.innerHTML = '<tr><td class="empty-cell" colspan="7">មិនទាន់មានទិន្នន័យ</td></tr>';
        return;
      }

      // Newest first, so staff sees the latest tickets at the top.
      var sorted = rows.slice().reverse();

      sorted.forEach(function (row) {
        var tr = document.createElement('tr');

        var badgeClass = STATUS_BADGE_CLASS[row.status] || 'badge-waiting';
        var statusLabel = STATUS_LABELS[row.status] || row.status;

        var actionsHtml = '';
        if (row.status === 'Waiting') {
          actionsHtml +=
            '<button class="btn-call" data-action="call">ហៅ</button>' +
            '<button class="btn-cancel" data-action="cancel">លុប</button>';
        } else if (row.status === 'Called') {
          actionsHtml +=
            '<button class="btn-done" data-action="done">បញ្ចប់</button>' +
            '<button class="btn-cancel" data-action="cancel">លុប</button>';
        }

        tr.innerHTML =
          '<td><strong>' + row.ticketNumber + '</strong></td>' +
          '<td>' + row.serviceType + '</td>' +
          '<td>' + row.counter + '</td>' +
          '<td><span class="badge ' + badgeClass + '">' + statusLabel + '</span></td>' +
          '<td>' + (row.createdTime || '-') + '</td>' +
          '<td>' + (row.calledTime || '-') + '</td>' +
          '<td><div class="row-actions">' + actionsHtml + '</div></td>';

        var callBtn = tr.querySelector('[data-action="call"]');
        if (callBtn) {
          callBtn.onclick = function () { updateStatus(row.queueId, 'Called', callBtn); };
        }
        var doneBtn = tr.querySelector('[data-action="done"]');
        if (doneBtn) {
          doneBtn.onclick = function () { updateStatus(row.queueId, 'Done', doneBtn); };
        }
        var cancelBtn = tr.querySelector('[data-action="cancel"]');
        if (cancelBtn) {
          cancelBtn.onclick = function () { updateStatus(row.queueId, 'Cancelled', cancelBtn); };
        }

        tbody.appendChild(tr);
      });
    }

    loadServiceButtons();
    refreshQueue();
    setInterval(refreshQueue, 5000);
  </script>
</body>
</html>
